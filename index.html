<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trâm's Health Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a clinic-chart look — a pale blue record header, then sticky section index beside stacked record panels. */
:root {
  --bg: #f2f7fc;
  --surface: #ffffff;
  --ink: #0f2a44;
  --muted: #5b7491;
  --line: #d4e3f2;
  --soft: #e1eefb;
  --accent: #1d6bcf;
  --accent-ink: #ffffff;
  --band: linear-gradient(180deg, #d9eafb 0%, #eef5fd 100%);
  --warn: #b45309;
  --warn-soft: #fdf0dd;
  --crit: #b42318;
  --crit-soft: #fde4e1;
  --ok: #0f7a5a;
  --ok-soft: #dcf3ea;
  --display: "Lexend", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", "Microsoft JhengHei", "Malgun Gothic", system-ui, sans-serif;
  --body: "Be Vietnam Pro", "PingFang TC", "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans CJK TC", "Microsoft JhengHei", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1826; --surface: #10233a; --ink: #e3eef9; --muted: #8ea8c5; --line: #21405f; --soft: #163352;
    --accent: #6aaeff; --accent-ink: #06182b; --band: linear-gradient(180deg, #12304f 0%, #0b1826 100%);
    --warn: #f3b263; --warn-soft: #3a2a12; --crit: #ff8a7d; --crit-soft: #3d1a17; --ok: #5fd3a8; --ok-soft: #12352a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1826; --surface: #10233a; --ink: #e3eef9; --muted: #8ea8c5; --line: #21405f; --soft: #163352;
  --accent: #6aaeff; --accent-ink: #06182b; --band: linear-gradient(180deg, #12304f 0%, #0b1826 100%);
  --warn: #f3b263; --warn-soft: #3a2a12; --crit: #ff8a7d; --crit-soft: #3d1a17; --ok: #5fd3a8; --ok-soft: #12352a;
  color-scheme: dark;
}
:lang(zh-Hans) { --body: "Be Vietnam Pro", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif; }
:lang(ja) { --body: "Be Vietnam Pro", "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
:lang(ko) { --body: "Be Vietnam Pro", "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif; }

* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.band { background: var(--band); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band .wrap { padding-block: 28px 24px; display: grid; gap: 22px; }

.topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.chart-id { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.langs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.langs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.identity { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
.seal { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); font-family: var(--display); font-weight: 600; font-size: 22px; }
.identity > div { min-width: 0; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.tagline { margin: 4px 0 0; color: var(--muted); }
.who { margin: 6px 0 0; font-weight: 500; }

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile h3 { margin: 0 0 4px; font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile p { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.tile.alert { border-color: var(--crit); background: var(--crit-soft); }
.tile.alert h3, .tile.alert p { color: var(--crit); }
.tile .blood { font-family: var(--display); font-size: 26px; line-height: 1.1; color: var(--accent); }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px; padding-block: 28px 48px; }
nav.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; display: grid; gap: 16px; }
.index h4 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.index ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.index a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
.index a:hover { background: var(--soft); }
.index a span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.toolbar small { color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--crit); }

.groups { display: grid; gap: 30px; }
.group-title { font-family: var(--display); font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--soft); }
.group-body { display: grid; gap: 14px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; scroll-margin-top: 16px; min-width: 0; }
.panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.panel h2 { font-family: var(--display); font-weight: 500; font-size: 18px; margin: 0; }
.panel header span { font-size: 12px; color: var(--muted); }

dl.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; margin: 0; }
dl.fields.wide { grid-template-columns: 1fr; }
.field { min-width: 0; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.field dt { font-size: 12.5px; color: var(--muted); }
.field dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.field dd.unset { color: var(--muted); font-style: italic; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); font-style: italic; margin: 4px 0; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; background: var(--soft); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }

input.cell, textarea.cell { width: 100%; min-width: 120px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
textarea.cell { min-height: 110px; resize: vertical; }
input.cell:focus, textarea.cell:focus { border-color: var(--accent); outline: none; }
.add-row { margin-top: 10px; }

.orig { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); font-style: normal; white-space: normal; }
.tag { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); vertical-align: middle; }
.tr-status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); font-size: 14px; }
.tr-status.muted { color: var(--muted); background: var(--surface); }
select.cell { width: 100%; min-width: 120px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
select.cell:focus { border-color: var(--accent); outline: none; }
details.backup { margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
details.backup summary { cursor: pointer; font-weight: 500; }
.backup-body { display: grid; gap: 10px; margin-top: 12px; }
.backup-body textarea { width: 100%; min-height: 120px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.backup-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { font-size: 13px; color: var(--muted); }
.msg.error { color: var(--crit); }
footer { color: var(--muted); font-size: 13px; margin-top: 22px; max-width: 70ch; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  nav.index { position: static; max-height: none; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .index h4 { display: none; }
  .index ul { display: contents; }
  .index a { white-space: nowrap; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  dl.fields { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
</style>
</head>
<body>
<div class="band">
  <div class="wrap">
    <div class="topline">
      <span class="chart-id">PHR · <span id="rec-id"></span></span>
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
    </div>
    <div class="identity">
      <div class="seal" id="seal"></div>
      <div>
        <h1 id="t-title"></h1>
        <p class="who" id="who"></p>
        <p class="tagline" id="t-tagline"></p>
      </div>
    </div>
    <div class="summary" id="summary" aria-live="polite"></div>
  </div>
</div>

<div class="wrap layout">
  <nav class="index" id="index"></nav>
  <main>
    <div class="toolbar">
      <small id="updated"></small>
      <button class="btn primary" id="mode-btn" type="button"></button>
    </div>
    <div class="tr-status" id="tr-status" role="status" hidden></div>
    <div class="groups" id="groups"></div>

    <details class="backup">
      <summary id="t-backup"></summary>
      <div class="backup-body">
        <div class="backup-row">
          <button class="btn" id="copy-btn" type="button"></button>
          <span class="msg" id="copy-msg"></span>
        </div>
        <label for="import-box" class="msg" id="t-import"></label>
        <textarea id="import-box" spellcheck="false"></textarea>
        <div class="backup-row">
          <button class="btn" id="restore-btn" type="button"></button>
          <span class="msg" id="restore-msg"></span>
        </div>
      </div>
    </details>
    <footer id="t-privacy"></footer>
  </main>
</div>

<script>

  ["ja", "日本語"], ["ko", "한국어"], ["vi", "Tiếng Việt"]
];

const KEEP = new Set(["fullName", "name", "phone", "email", "address", "policyNo", "dob", "date", "diagnosed", "since",

const isText = (key) => !CHOICES[key] && !KEEP.has(key);

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}

function guessLang() {
  const n = (navigator.language || "en").toLowerCase();
  if (n.startsWith("zh")) return /cn|sg|hans/.test(n) ? "zh-Hans" : "zh-Hant";
  return ["ja", "ko", "vi"].find(c => n.startsWith(c)) || "en";
}

let lang = load(LANG_STORE, null) || guessLang();
if (!LANG_NAME[lang]) lang = "en";
const t = key => I18N[lang][key] ?? I18N.en[key] ?? key;

function detectLang(text, fallback) {
  if (/[가-힯ᄀ-ᇿ]/.test(text)) return "ko";
  if (/[぀-ヿ]/.test(text)) return "ja";
  if (/[一-鿿]/.test(text)) return fallback.startsWith("zh") || fallback === "ja" ? fallback : "zh-Hant";
  if (/[àáảãạăằắẳẵặâầấẩẫậđèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ]/i.test(text)) return "vi";
  if (/[a-z]/i.test(text)) return fallback === "vi" ? "vi" : "en";
  return fallback;
}

function toCode(key, s) {
  s = String(s ?? "").trim();
  if (!s || CHOICES[key].includes(s)) return s;
  const low = s.toLowerCase();
  const hit = CHOICES[key].find(c => LANGS.some(([l]) => (I18N[l]["opt_" + c] || c).toLowerCase() === low));
  return hit || s;
}

function normValue(key, v) {
  const raw = v && typeof v === "object" ? v.t : v;
  if (CHOICES[key]) return toCode(key, raw);
  if (KEEP.has(key)) return String(raw ?? "");
  if (v && typeof v === "object") return { l: LANG_NAME[v.l] ? v.l : lang, t: String(v.t ?? ""), tr: v.tr && typeof v.tr === "object" ? v.tr : {} };
  const s = String(v ?? "");
  return s.trim() ? { l: detectLang(s, lang), t: s, tr: {} } : "";
}

function normRow(keys, row) {
  const out = {};
  keys.forEach(k => { if (row && row[k] != null) out[k] = normValue(k, row[k]); });
  return out;
}

function normalize(data) {
  const r = { updated: data.updated || null };
  SECTIONS.forEach(s => {
    r[s.id] = s.type === "list"
      ? (Array.isArray(data[s.id]) ? data[s.id] : []).map(row => normRow(s.keys, row))
      : normRow(s.keys, data[s.id]);
  });
  return r;
}

function save(touch = true) {
  if (touch) record.updated = new Date().toISOString();
  try { localStorage.setItem(STORE, JSON.stringify(record)); } catch {}
}

function filled(v) {
  return v && typeof v === "object" ? v.t.trim() !== "" : String(v ?? "").trim() !== "";
}

function shown(v) {
  if (v.l === lang) return { t: v.t };
  const tr = v.tr[lang];
  return tr ? { t: tr.t, auto: tr.auto } : { t: v.t, pending: true };
}

function plain(key, v) {
  if (!filled(v)) return "";
  if (typeof v === "object") return shown(v).t;
  if (CHOICES[key]) return I18N[lang]["opt_" + v] ?? v;
  return v;
}

function valueHtml(key, v) {
  if (!filled(v)) return "";
  if (CHOICES[key]) {
    const label = esc(plain(key, v));
    return key === "severity" || key === "status" ? `<span class="chip ${CHIP[v] || ""}">${label}</span>` : label;
  }
  if (typeof v !== "object") return esc(v);
  const s = shown(v);
  if (s.auto) return `${esc(s.t)}<small class="orig" title="${esc(t("autoTag"))}" lang="${v.l}">${esc(LANG_NAME[v.l])}: ${esc(v.t)}</small>`;
  if (s.pending) return `<span lang="${v.l}">${esc(s.t)}</span> <span class="tag">${esc(LANG_NAME[v.l])}</span>`;
  return esc(s.t);
}

  const p = record.profile;

  $("rec-id").textContent = p.dob || "";

function renderSummary() {
  const allergies = record.allergies.map(a => plain("substance", a.substance)).filter(Boolean);
  const meds = record.currentMeds.map(m => [plain("drug", m.drug), plain("dose", m.dose)].filter(Boolean).join(" ")).filter(Boolean);
  const c = record.emergency.find(c => filled(c.name) || filled(c.phone));
  const contact = c && [c.name, filled(c.relation) && `(${plain("relation", c.relation)})`, c.phone].filter(Boolean).join(" ");
  const tiles = [
    { label: t("bloodType"), html: `<p class="blood">${esc(record.profile.bloodType) || "—"}</p>` },
    { label: t("allergies"), html: `<p>${esc(allergies.length ? allergies.join(", ") : t("none"))}</p>`, alert: allergies.length > 0 },
    { label: t("currentMeds"), html: `<p>${esc(meds.length ? meds.join(", ") : t("none"))}</p>` },
    { label: t("emergency"), html: `<p>${esc(contact || t("none"))}</p>` }
  ];
  $("summary").innerHTML = tiles.map(x =>
    `<div class="tile${x.alert ? " alert" : ""}"><h3>${esc(x.label)}</h3>${x.html}</div>`).join("");
}

function countFor(s) {
  return s.type === "list"
    ? String(record[s.id].length)
    : `${s.keys.filter(k => filled(record[s.id][k])).length}/${s.keys.length}`;
}

function renderIndex() {
  $("index").innerHTML = GROUPS.map(g => `
    <div><h4>${esc(t(g))}</h4><ul>
      ${SECTIONS.filter(s => s.g === g).map(s =>
        `<li><a href="#${s.id}">${esc(t(s.id))}<span>${countFor(s)}</span></a></li>`).join("")}
    </ul></div>`).join("");
}

function inputHtml(sec, key, v, idx) {
  const id = idx == null ? `${sec}-${key}` : `${sec}-${idx}-${key}`;
  const data = `id="${id}" data-sec="${sec}" data-key="${key}"${idx == null ? "" : ` data-idx="${idx}"`} aria-label="${esc(t(key))}"`;
  if (CHOICES[key]) {
    const opts = CHOICES[key].map(c => `<option value="${esc(c)}"${c === v ? " selected" : ""}>${esc(I18N[lang]["opt_" + c] ?? c)}</option>`);
    if (filled(v) && !CHOICES[key].includes(v)) opts.push(`<option value="${esc(v)}" selected>${esc(v)}</option>`);
    return `<select class="cell" ${data}><option value="">${esc(t("choose"))}</option>${opts.join("")}</select>`;
  }
  if (!isText(key)) return `<input class="cell" type="${DATE_KEYS.has(key) ? "date" : "text"}" ${data} value="${esc(v)}">`;

  const obj = typeof v === "object" ? v : null;
  const foreign = obj && obj.t.trim() && obj.l !== lang;
  const value = !obj ? "" : obj.l === lang ? obj.t : obj.tr[lang]?.t ?? "";
  const ph = foreign ? ` placeholder="${esc(obj.t)}"` : "";
  const hint = foreign ? `<small class="orig" lang="${obj.l}">${esc(t("original"))} (${esc(LANG_NAME[obj.l])}): ${esc(obj.t)}</small>` : "";
  const field = key === "generalNotes"
    ? `<textarea class="cell" ${data}${ph}>${esc(value)}</textarea>`
    : `<input class="cell" type="text" ${data}${ph} value="${esc(value)}">`;
  return field + hint;
}

function renderSection(s) {
  const data = record[s.id];
  let body;
  if (s.type === "fields") {
    body = `<dl class="fields${s.wide ? " wide" : ""}">${s.keys.map(k => `
      <div class="field"><dt>${esc(t(k))}</dt>${editing
        ? `<dd>${inputHtml(s.id, k, data[k] ?? "")}</dd>`
        : filled(data[k]) ? `<dd>${valueHtml(k, data[k])}</dd>` : `<dd class="unset">${esc(t("notSet"))}</dd>`}
      </div>`).join("")}</dl>`;
  } else {
    const head = `<tr>${s.keys.map(k => `<th>${esc(t(k))}</th>`).join("")}${editing ? "<th></th>" : ""}</tr>`;
    const rows = data.map((row, i) => `<tr>${s.keys.map(k =>
      `<td>${editing ? inputHtml(s.id, k, row[k] ?? "", i) : valueHtml(k, row[k])}</td>`).join("")}
      ${editing ? `<td><button class="btn small danger" type="button" data-remove="${s.id}" data-idx="${i}">${esc(t("remove"))}</button></td>` : ""}</tr>`).join("");
    body = data.length
      ? `<div class="table-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
      : `<p class="empty">${esc(t("empty"))}</p>`;
    if (editing) body += `<button class="btn small add-row" type="button" data-add="${s.id}">+ ${esc(t("add"))}</button>`;
  }
  return `<section class="panel" id="${s.id}">
    <header><h2>${esc(t(s.id))}</h2><span>${countFor(s)}</span></header>${body}</section>`;
}

function renderBody() {
  $("groups").innerHTML = GROUPS.map(g => `
    <div><h3 class="group-title">${esc(t(g))}</h3>
      <div class="group-body">${SECTIONS.filter(s => s.g === g).map(renderSection).join("")}</div>
    </div>`).join("");
}

function renderAll() {
  renderStatic();
  renderMeta();
  renderBody();
}

// --- On-device translation (Chrome/Edge Translator API) ---

const translators = new Map();
let trState = { kind: "idle" };
let runId = 0;

function setTr(state) {
  trState = state;
  const box = $("tr-status");
  const fill = s => s.replace("{n}", state.n).replace("{total}", state.total).replace("{p}", state.p);
  const text = { working: "trWorking", download: "trDownloading", needClick: "trNeedClick", unsupported: "trUnsupported", failed: "trFailed" }[state.kind];
  box.hidden = !text;
  if (!text) return;
  box.className = "tr-status" + (state.kind === "unsupported" || state.kind === "failed" ? " muted" : "");
  box.innerHTML = `<span>${esc(fill(t(text)))}</span>` +
    (state.kind === "needClick" ? ` <button class="btn small primary" type="button" id="tr-btn">${esc(t("trBtn"))}</button>` : "");
}

function pendingValues() {
  const out = [];
  const take = (key, v) => { if (isText(key) && v && typeof v === "object" && v.t.trim() && v.l !== lang && !v.tr[lang]) out.push(v); };
  SECTIONS.forEach(s => {
    if (s.type === "list") record[s.id].forEach(row => s.keys.forEach(k => take(k, row[k])));
    else s.keys.forEach(k => take(k, record[s.id][k]));
  });
  return out;
}

async function getTranslator(from, to) {
  const key = from + ">" + to;
  if (translators.has(key)) return translators.get(key);
  const opts = { sourceLanguage: TR_CODE[from], targetLanguage: TR_CODE[to] };
  const avail = await Translator.availability(opts);
  if (avail === "unavailable") throw new Error("unavailable");
  if (avail !== "available" && !navigator.userActivation?.isActive) throw new Error("activation");
  const tr = await Translator.create({
    ...opts,
    monitor(m) { m.addEventListener("downloadprogress", e => setTr({ kind: "download", p: Math.round(e.loaded * 100) })); }
  });
  translators.set(key, tr);
  return tr;
}

async function translateAll() {
  const id = ++runId;
  const target = lang;
  const items = pendingValues();
  if (!items.length) return setTr({ kind: "idle" });
  if (!("Translator" in self)) return setTr({ kind: "unsupported" });

  const deadPairs = new Set();
  let failed = 0, needClick = false;
  setTr({ kind: "working", n: 0, total: items.length });
  for (const [i, v] of items.entries()) {
    if (id !== runId) return;
    const pair = v.l + ">" + target;
    try {
      if (deadPairs.has(pair)) throw new Error("unavailable");
      const tr = await getTranslator(v.l, target);
      v.tr[target] = { t: await tr.translate(v.t), auto: true };
    } catch (e) {
      if (e.message === "activation") { needClick = true; break; }
      deadPairs.add(pair);
      failed++;
    }
    if (id === runId) setTr({ kind: "working", n: i + 1, total: items.length });
  }
  if (id !== runId) return;
  save(false);
  if (!editing) { renderMeta(); renderBody(); }
  setTr(needClick ? { kind: "needClick" } : failed ? { kind: "failed" } : { kind: "idle" });
}

// --- Events ---

$("langs").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG_STORE, JSON.stringify(lang)); } catch {}
  renderAll();
  if (!editing) translateAll();
});

$("mode-btn").addEventListener("click", () => {
  editing = !editing;
  renderAll();
  if (!editing) translateAll();
});

$("tr-status").addEventListener("click", e => {
  if (e.target.id === "tr-btn") translateAll();
});

$("groups").addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset.sec) return;
  const { sec, key, idx } = el.dataset;
  const target = idx == null ? record[sec] : record[sec][idx];
  const text = el.value;

  if (!isText(key)) {
    target[key] = text;
  } else {
    const cur = target[key];
    const typedLang = detectLang(text, lang);
    const isOriginal = !cur || typeof cur !== "object" || !cur.t.trim() || cur.l === lang;
    if (isOriginal || typedLang !== lang) {
      target[key] = text.trim() ? { l: typedLang, t: text, tr: {} } : "";
    } else if (text.trim()) {
      cur.tr[lang] = { t: text, auto: false };
    } else {
      delete cur.tr[lang];
    }
  }
  save();
  renderMeta();
});

$("groups").addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  const rm = e.target.closest("[data-remove]");
  if (add) {
    const sec = add.dataset.add;
    record[sec].push({});
    save();
    renderMeta();
    renderBody();
    const s = SECTIONS.find(x => x.id === sec);
    $(`${sec}-${record[sec].length - 1}-${s.keys[0]}`)?.focus();
  } else if (rm) {
    record[rm.dataset.remove].splice(Number(rm.dataset.idx), 1);
    save();
    renderMeta();
    renderBody();
  }
});

$("copy-btn").addEventListener("click", () => {
  const text = JSON.stringify(record, null, 2);
  const box = $("import-box");
  const msg = $("copy-msg");
  navigator.clipboard.writeText(text)
    .then(() => { msg.textContent = t("copied"); })
    .catch(() => { box.value = text; box.select(); msg.textContent = t("copyFail"); });
});

$("restore-btn").addEventListener("click", () => {
  const msg = $("restore-msg");
  try {
    const data = JSON.parse($("import-box").value);
    if (!data || typeof data !== "object" || !data.profile) throw new Error();
    record = normalize(data);
    save();
    renderAll();
    translateAll();
    msg.className = "msg";
    msg.textContent = t("restored");
  } catch {
    msg.className = "msg error";
    msg.textContent = t("badJson");
  }
});

renderAll();
translateAll();
</script>
</body>
</html>
